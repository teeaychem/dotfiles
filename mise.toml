[env]
XDG_DESKTOP_DIR = "{{env.HOME}}/Desktop"
XDG_DOWNLOAD_DIR = "{{env.HOME}}/Downloads"
XDG_TEMPLATES_DIR = "{{env.HOME}}/Templates"
XDG_PUBLICSHARE_DIR = "{{env.HOME}}/Public"
XDG_DOCUMENTS_DIR = "{{env.HOME}}/Documents"
XDG_MUSIC_DIR = "{{env.HOME}}/Music"
XDG_PICTURES_DIR = "{{env.HOME}}/Pictures"
XDG_VIDEOS_DIR = "{{env.HOME}}/Videos"

HOMEBREW_BAT = "1"
HOMEBREW_NO_AUTO_UPDATE = "1"
HOMEBREW_NO_UPGRADE_AUTO_UPDATES_CASKS = "1"
HOMEBREW_NO_ENV_HINTS = "1"

EDITOR = "nvim"
PAGER = "less"
LESS = "-RF"
MANPAGER = "nvim +Man!"
FD_OPTIONS = "--hidden --follow"
FZF_DEFAULT_COMMAND = "fd --type f --hidden --follow --exclude .git"

OPAMROOT = "{{xdg_data_home}}/opam"

PYTHONPYCACHEPREFIX = "{{xdg_cache_home}}/python_cache"
PYTHON_HISTORY = "{{xdg_state_home}}/python/history"
IPYTHONDIR = "{{xdg_cache_home}}/ipython"
MPLCONFIGDIR = "{{xdg_cache_home}}/matplotlib"

DICTIONARY = "en_GB"
DICPATH = "{{xdg_data_home}}/hunspell"
LESSHISTFILE = "{{xdg_state_home}}/less/history"
KERAS_HOME = "{{xdg_data_home}}/keras"
ELAN_HOME = "{{env.HOME}}/.local/opt/elan"

REPOS_DIR = "{{env.HOME}}/repos"
LLVM_SRC = "{{env.HOME}}/repos/llvm"

[env._]
path = [
  "{{env.HOME}}/.cargo/bin",
  "{{env.HOME}}/.local/bin",
  "{{env.ELAN_HOME}}/bin",
]

[dotfiles]
"~" = { source = "shared", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/mise/config.macos.toml" = { source = "mise.macos.toml", mode = "symlink" }
"~/.config/mise/config.linux.toml" = { source = "mise.linux.toml", mode = "symlink" }
"~/.config/mise/miserc.toml" = { source = ".miserc.toml", mode = "symlink" }

[settings]
experimental = true
