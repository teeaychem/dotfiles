[dotfiles]
"~" = { source = "../shared", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/mise/miserc.toml" = { source = "../.miserc.toml", mode = "symlink" }

# Link source files individually so generated state stays outside the checkout.
"~/.config/emacs" = { source = "../dotconfig/emacs", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/fish" = { source = "../dotconfig/fish", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/alacritty.toml" = { source = "../dotconfig/alacritty.toml", mode = "symlink" }
"~/.config/bat" = { source = "../dotconfig/bat", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/espanso" = { source = "../dotconfig/espanso", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/git" = { source = "../dotconfig/git", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/hunspell" = { source = "../dotconfig/hunspell", mode = "symlink-each", exclude = [".DS_Store"] }
